<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downria - Downloader Keren</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f9fc; }
    .saweria-card { background: #ffffff; border: 2px solid #111; border-radius: 24px; box-shadow: 5px 5px 0px #111; }
    .saweria-btn { background: #fa9d00; color: #111; font-weight: 700; border: 2px solid #111; border-radius: 16px; box-shadow: 3px 3px 0px #111; transition: all 0.15s ease; }
    .saweria-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #111; }
    .saweria-btn:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0px #111; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full saweria-card p-6 text-center">
    <!-- Header Logo -->
    <div class="flex items-center justify-center gap-2 mb-4">
      <div class="w-10 h-10 bg-amber-400 rounded-full border-2 border-black flex items-center justify-center font-extrabold text-xl">D</div>
      <h1 class="text-2xl font-black text-gray-900">Downria</h1>
    </div>

    <p class="text-sm font-semibold text-gray-600 mb-6">Paste link video/media kamu di bawah ini!</p>

    <!-- Form Input -->
    <form id="downloadForm" class="space-y-4">
      <input type="url" id="mediaUrl" required placeholder="https://www.instagram.com/p/... atau TikTok..." 
             class="w-full px-4 py-3 rounded-xl border-2 border-black focus:outline-none focus:ring-2 focus:ring-amber-400 font-medium text-sm">
      
      <button type="submit" id="submitBtn" class="w-full py-3 saweria-btn text-base flex items-center justify-center gap-2">
        <span>Unduh Sekarang</span>
      </button>
    </form>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden mt-6 text-amber-600 font-bold animate-pulse text-sm">
      ⏳ Sedang mengekstrak media lewat Scraper...
    </div>

    <!-- Error Message -->
    <div id="error" class="hidden mt-4 p-3 bg-red-100 border-2 border-red-500 rounded-xl text-red-700 text-xs font-bold break-all"></div>

    <!-- Result Box -->
    <div id="result" class="hidden mt-6 p-4 border-2 border-black rounded-2xl bg-amber-50 text-left space-y-3">
      
      <!-- Video Preview Player -->
      <video id="resVideo" controls class="hidden w-full max-h-60 rounded-xl border-2 border-black bg-black object-contain"></video>

      <!-- Container untuk Galeri Foto / Slide -->
      <div id="imageContainer" class="hidden space-y-3 max-h-72 overflow-y-auto pr-1"></div>
      
      <!-- Title -->
      <h2 id="resTitle" class="font-bold text-gray-800 text-sm line-clamp-2"></h2>
      
      <!-- Download Buttons Container -->
      <div id="downloadLinks" class="space-y-2 pt-2"></div>
    </div>
  </div>

  <script>
    const BACKEND_API = '/api/download';

    const form = document.getElementById('downloadForm');
    const urlInput = document.getElementById('mediaUrl');
    const loading = document.getElementById('loading');
    const errorDiv = document.getElementById('error');
    const resultDiv = document.getElementById('result');
    const resVideo = document.getElementById('resVideo');
    const imageContainer = document.getElementById('imageContainer');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();

      loading.classList.remove('hidden');
      errorDiv.classList.add('hidden');
      resultDiv.classList.add('hidden');
      resVideo.classList.add('hidden');
      imageContainer.classList.add('hidden');
      resVideo.pause();

      try {
        const response = await fetch(BACKEND_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Gagal mengambil data media.');
        }

        const resData = data.result || {};
        
        // Ambil Judul/Caption
        const title = resData.title || resData.desc || resData.description || resData.caption || 'Media Downloader';
        document.getElementById('resTitle').innerText = title;

        const linksContainer = document.getElementById('downloadLinks');
        linksContainer.innerHTML = '';
        imageContainer.innerHTML = '';

        // Ekstraksi Foto / Slide / Carousel
        let rawImages = resData.images || resData.photos || resData.slide || resData.image || resData.carousel;
        let imageList = [];
        if (rawImages) {
          if (typeof rawImages === 'string') rawImages = [rawImages];
          if (Array.isArray(rawImages)) {
            imageList = rawImages.filter(item => typeof item === 'string' && item.startsWith('http'));
          }
        }

        // Ekstraksi Video & Resolusi
        let videoList = [];
        if (resData.urls && Array.isArray(resData.urls)) {
          resData.urls.forEach((item, idx) => {
            const vUrl = typeof item === 'string' ? item : (item.url || item.link);
            const qLabel = item.quality || item.resolution || item.type || `HD (${idx + 1})`;
            if (vUrl && typeof vUrl === 'string' && !vUrl.endsWith('.jpg') && !vUrl.endsWith('.png')) {
              videoList.push({ label: qLabel, url: vUrl });
            }
          });
        }

        if (resData.url || resData.video) {
          const vObj = resData.url || resData.video;
          if (typeof vObj === 'string' && !vObj.endsWith('.jpg')) {
            videoList.push({ label: 'HD / No Watermark', url: vObj });
          } else if (typeof vObj === 'object' && vObj !== null) {
            for (const key in vObj) {
              if (typeof vObj[key] === 'string' && vObj[key].startsWith('http') && !vObj[key].endsWith('.jpg')) {
                let resName = key.replace(/_/g, ' ').toUpperCase();
                if (resName.includes('720') || resName.includes('1080') || resName.includes('4K') || resName.includes('2K') || resName.includes('360') || resName.includes('480')) {
                  resName = resName;
                } else {
                  resName = `KUALITAS ${resName}`;
                }
                videoList.push({ label: resName, url: vObj[key] });
              }
            }
          }
        }

        // Hapus duplikat
        videoList = [...new Map(videoList.map(item => [item.url, item])).values()];
        imageList = [...new Set(imageList)];

        // KONDISI 1: Jika post berisi FOTO / SLIDE (utamakan tampilkan gambar jika ada dan tidak ada video valid)
        if (imageList.length > 0 && videoList.length === 0) {
          imageList.forEach((imgUrl, idx) => {
            const imgEl = document.createElement('img');
            imgEl.src = imgUrl;
            imgEl.className = 'w-full h-52 object-cover rounded-xl border-2 border-black';
            imageContainer.appendChild(imgEl);

            // Tombol download untuk tiap foto/slide
            const a = document.createElement('a');
            a.href = imgUrl;
            a.target = '_blank';
            a.download = '';
            a.className = 'block text-center py-2.5 px-4 saweria-btn text-xs font-bold truncate mt-1';
            a.innerText = `⬇️ DOWNLOAD FOTO / SLIDE ${idx + 1}`;
            linksContainer.appendChild(a);
          });
          imageContainer.classList.remove('hidden');
        } 
        // KONDISI 2: Jika post berupa VIDEO / REELS
        else if (videoList.length > 0) {
          resVideo.src = videoList[0].url;
          resVideo.classList.remove('hidden');

          videoList.forEach((item) => {
            const a = document.createElement('a');
            a.href = item.url;
            a.target = '_blank';
            a.download = '';
            a.className = 'block text-center py-2.5 px-4 saweria-btn text-xs font-bold truncate';
            a.innerText = `⬇️ DOWNLOAD (${item.label.toUpperCase()})`;
            linksContainer.appendChild(a);
          });
        } else {
          throw new Error("Media tidak ditemukan atau tipe postingan tidak didukung.");
        }

        resultDiv.classList.remove('hidden');
      } catch (err) {
        errorDiv.innerText = err.message || 'Terjadi kesalahan sistem.';
        errorDiv.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
